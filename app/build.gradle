plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.yttranscript'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.yttranscript'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
