name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Gradle 8.14.3
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors \
            -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TranscriptorYT-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TranscriptorYT.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TranscriptorYT.apk \
            --title "Transcriptor YT (última versión)" \
            --notes "APK compilado automáticamente desde ${{ github.sha }}"
